[workspace]
resolver = "2"
members = [
    "crates/schematools",
    "crates/cli"
]

[workspace.package]
license = "MIT"
repository = "https://github.com/kstasik/schema-tools"
version = "0.24.0"

[workspace.dependencies]
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
yaml_serde = "0.10"
log = "0.4"
thiserror = "2.0"
